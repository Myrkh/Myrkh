<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d0b"/>
      <stop offset="50%" stop-color="#0a2a22"/>
      <stop offset="100%" stop-color="#040d0b"/>
    </linearGradient>
    <linearGradient id="wave1g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f6e56" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#085041" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="wave2g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d9e75" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f6e56" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d9e75" stop-opacity="0"/>
      <stop offset="30%" stop-color="#1d9e75" stop-opacity="1"/>
      <stop offset="70%" stop-color="#5dcaa5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5dcaa5" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="180" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#1d9e75" stroke-opacity="0.06" stroke-width="0.5">
    <line x1="0" y1="30" x2="900" y2="30"/>
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="90" x2="900" y2="90"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="150" y1="0" x2="150" y2="180"/>
    <line x1="300" y1="0" x2="300" y2="180"/>
    <line x1="450" y1="0" x2="450" y2="180"/>
    <line x1="600" y1="0" x2="600" y2="180"/>
    <line x1="750" y1="0" x2="750" y2="180"/>
  </g>

  <!-- Wave shapes -->
  <path d="M0,140 C150,110 300,160 450,130 C600,100 750,150 900,120 L900,180 L0,180 Z" fill="url(#wave1g)"/>
  <path d="M0,155 C200,135 350,165 550,145 C700,128 800,160 900,140 L900,180 L0,180 Z" fill="url(#wave2g)"/>

  <!-- Accent line -->
  <line x1="0" y1="108" x2="900" y2="108" stroke="url(#accentLine)" stroke-width="1" opacity="0.5"/>

  <!-- Corner brackets -->
  <g stroke="#1d9e75" stroke-width="1.5" stroke-opacity="0.5" fill="none">
    <polyline points="18,8 8,8 8,22"/>
    <polyline points="882,8 892,8 892,22"/>
    <polyline points="18,172 8,172 8,158"/>
    <polyline points="882,172 892,172 892,158"/>
  </g>

  <!-- Dot pattern right side -->
  <g fill="#1d9e75" fill-opacity="0.15">
    <circle cx="820" cy="30" r="2"/>
    <circle cx="840" cy="30" r="2"/>
    <circle cx="860" cy="30" r="2"/>
    <circle cx="820" cy="50" r="2"/>
    <circle cx="840" cy="50" r="2"/>
    <circle cx="860" cy="50" r="2"/>
    <circle cx="820" cy="70" r="2"/>
    <circle cx="840" cy="70" r="2"/>
    <circle cx="860" cy="70" r="2"/>
  </g>

  <!-- Main title -->
  <text x="450" y="72" font-family="'Courier New', monospace" font-size="58" font-weight="700"
        text-anchor="middle" fill="#ffffff" filter="url(#glow)" letter-spacing="-1">Myrkh</text>

  <!-- Teal accent under title -->
  <rect x="320" y="80" width="260" height="2" rx="1" fill="url(#accentLine)" opacity="0.8"/>

  <!-- Subtitle -->
  <text x="450" y="104" font-family="'Courier New', monospace" font-size="14"
        text-anchor="middle" fill="#5dcaa5" letter-spacing="2" font-weight="400">PROCESS CONTROL &amp; FUNCTIONAL SAFETY</text>

  <!-- Small tag -->
  <rect x="362" y="116" width="176" height="18" rx="3" fill="#0f6e56" fill-opacity="0.4" stroke="#1d9e75" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="450" y="129" font-family="'Courier New', monospace" font-size="10"
        text-anchor="middle" fill="#9fe1cb" letter-spacing="1">PRISM · sil-engine · OPC-UA</text>
</svg>
